<script>
window.onerror = function(msg, src, line, col, err) {
  document.body.innerHTML = '<pre style="color:#fff;background:#900;padding:16px;white-space:pre-wrap;font-size:14px;">JS ERROR:\n' + msg + '\nat ' + src + ':' + line + ':' + col + '\n' + (err && err.stack || '') + '</pre>';
};
</script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Survey Data Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Same EcologyHive brand tokens as every other app in this platform. */
  --bg: #0d1614; --bg-elevated: #16211f; --bg-card: #1c2b28; --border: #2c3f3c;
  --text: #eef1f4; --text-muted: #9aa5b1; --text-faint: #6b7480;
  --accent: #F68A15; --accent-dim: #4a3010; --accent-text: #1a1208;
  --teal: #A6D7D2; --teal-dim: #153f3e; --danger: #e85a6a; --danger-dim: #3d2226;
  --warn: #e0b23a;
  --radius: 10px; --radius-lg: 16px;
  --font-display: 'Montserrat', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
:root[data-theme="light"] {
  --bg: #F3F6F4; --bg-elevated: #ffffff; --bg-card: #ffffff; --border: #d7ddd7;
  --text: #1b2420; --text-muted: #5c655f; --text-faint: #8a938d;
  --accent: #F68A15; --accent-dim: #fde6c8; --accent-text: #1a1208;
  --teal: #0F5C5C; --teal-dim: #e1f0ee; --danger: #c0392b; --danger-dim: #fbe4e2;
  --warn: #b8860b;
}
.eh-theme-toggle {
  position:fixed; top:calc(env(safe-area-inset-top, 0px) + 8px); right:10px; z-index:9999;
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text); font-size:16px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.eh-theme-toggle:active { transform:scale(.94); }
</style>
<script>
  try {
    var ehTheme = localStorage.getItem('eh-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', ehTheme);
  } catch (e) {}
</script>
<style>
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-body); height:100%; }
#root { height:100vh; }
.app-shell { display:flex; height:100vh; }
.sidebar { width:260px; flex-shrink:0; background:var(--bg-elevated); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
.sidebar-app-name { font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:0.02em; }
.sidebar-app-sub { font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px; font-family:var(--font-mono); }
.sidebar-section { padding:12px; }
.tree-node { display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-muted); }
.tree-node:hover { background:var(--bg-card); }
.tree-node-active { background:var(--accent-dim); color:var(--accent); font-weight:600; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.main-header { padding:16px 24px; border-bottom:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; justify-content:space-between; }
.main-title { font-family:var(--font-display); font-weight:700; font-size:20px; }
.main-subtitle { font-size:12px; color:var(--text-muted); margin-top:3px; font-family:var(--font-mono); }
.content { flex:1; overflow-y:auto; padding:24px; }
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
.card-title { font-family:var(--font-display); font-weight:600; font-size:15px; }
.card-sub { font-size:12px; color:var(--text-muted); margin-top:3px; font-family:var(--font-mono); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-body); font-weight:600; font-size:13px; padding:9px 14px; border-radius:var(--radius); border:1px solid transparent; cursor:pointer; }
.btn:active { transform:scale(0.98); }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
.btn-primary { background:var(--accent); color:var(--accent-text); }
.btn-secondary { background:var(--bg-card); color:var(--text); border-color:var(--border); }
.btn-danger { background:var(--danger-dim); color:var(--danger); border-color:var(--danger); }
.btn-small { padding:6px 10px; font-size:12px; }
.btn-tiny { padding:5px 9px; font-size:11px; }
.btn-big { padding:12px 20px; font-size:14px; }
.section-title { font-family:var(--font-display); font-weight:600; font-size:15px; margin:24px 0 10px; }
.section-title:first-child { margin-top:0; }
.empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; padding:80px 24px; color:var(--text-muted); }
.empty-title { font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--text); margin-bottom:6px; }
.empty-text { font-size:13px; line-height:1.5; max-width:420px; }
.modal-overlay { position:fixed; inset:0; background:rgba(10,12,14,0.7); display:flex; align-items:center; justify-content:center; z-index:5000; padding:24px; box-sizing:border-box; }
.modal { background:var(--bg-elevated); border-radius:var(--radius-lg); width:100%; max-width:440px; max-height:100%; overflow-y:auto; border:1px solid var(--border); padding:20px; box-sizing:border-box; }
.modal-wide { max-width:900px; }
.modal-title { font-family:var(--font-display); font-weight:600; font-size:16px; margin-bottom:14px; }
.modal-actions { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
.pill { font-size:10px; font-weight:700; padding:3px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:0.05em; background:var(--bg-card); color:var(--text-faint); border:1px solid var(--border); }
.warning-banner { background:var(--danger-dim); border:1px solid var(--danger); color:var(--danger); border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
.segmented { display:flex; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:3px; }
.segment { flex:1; background:none; border:none; color:var(--text-muted); font-family:var(--font-body); font-weight:600; font-size:12px; padding:7px 10px; border-radius:8px; cursor:pointer; }
.segment-active { background:var(--accent); color:var(--accent-text); }
.review-stage-zoom { position:absolute; bottom:16px; left:16px; display:flex; gap:6px; z-index:10; }
.review-stage-inner { position:absolute; inset:0; overflow:hidden; cursor:grab; }
.review-stage-inner.panning { cursor:grabbing; }
.review-stage-inner img { display:block; width:100%; height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none; }
.video-controls-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
.speed-btn-active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
.map-picker { width:100%; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); background:var(--bg-card); }
.sr-map-icon { background:none; border:none; }
</style>
</head>
